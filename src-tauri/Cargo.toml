[package]
name = "aurelia-space"
version = "0.1.0"
description = "AureliaSpace — a personal terminal for running Claude Code accounts side by side"
edition = "2021"

[lib]
name = "aurelia_space_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native"] }
discord-rich-presence = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.13"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
