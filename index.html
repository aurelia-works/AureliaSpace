<!doctype html>
<html lang="en" data-dev="%VITE_AURELIA_DEV%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AureliaSpace</title>
    <style>
      /* Load-in splash: inline so it paints before the app bundle loads. Removed by hideSplash() in main.tsx. */
      #splash {
        --splash-bg: #0d0c11;
        --splash-text: #e6e1d6;
        --splash-glow: rgba(233, 176, 75, 0.22);
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: radial-gradient(60% 50% at 50% 45%, #1a1720 0%, var(--splash-bg) 70%);
        transition: opacity 0.5s ease, transform 0.6s ease;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      @media (prefers-color-scheme: light) {
        #splash {
          --splash-bg: #e9e4da;
          --splash-text: #26232b;
          --splash-glow: rgba(185, 121, 42, 0.2);
          background: radial-gradient(60% 50% at 50% 45%, #f5f2ec 0%, var(--splash-bg) 70%);
        }
      }
      #splash.out {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      #splash .splash-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      #splash .jelly {
        width: 108px;
        height: 108px;
        filter: drop-shadow(0 0 22px var(--splash-glow));
        animation: jelly-rise 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) both, jelly-bob 3.2s ease-in-out 1.1s infinite;
      }
      #splash .bell {
        transform-origin: 50% 60%;
        animation: bell-pulse 1.6s ease-in-out 0.3s infinite;
      }
      #splash .tentacle {
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
        transform-origin: 50% 0;
        animation: draw 0.9s ease-out forwards, sway 2.4s ease-in-out infinite;
      }
      #splash .tentacle:nth-child(1) { animation-delay: 0.35s, 1.2s; }
      #splash .tentacle:nth-child(2) { animation-delay: 0.45s, 1.4s; }
      #splash .tentacle:nth-child(3) { animation-delay: 0.5s, 1.3s; }
      #splash .tentacle:nth-child(4) { animation-delay: 0.6s, 1.5s; }
      #splash .name {
        font: 600 22px/1 -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        letter-spacing: -0.015em;
        color: var(--splash-text);
        display: flex;
      }
      #splash .name span {
        opacity: 0;
        transform: translateY(6px);
        animation: letter 0.5s ease-out forwards;
        animation-delay: calc(0.55s + var(--i) * 0.035s);
      }
      #splash .name .gold {
        color: #e9b04b;
      }
      #splash .mote {
        position: absolute;
        bottom: -10px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #ffd98a;
        box-shadow: 0 0 8px 2px rgba(233, 176, 75, 0.6);
        opacity: 0;
        animation: mote linear infinite;
      }
      /* Dev build (VITE_AURELIA_DEV=1): binary rain behind the mark, a DEV sash, "Dev" in the name. */
      #splash .rain {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.45;
        display: none;
      }
      html[data-dev="1"] #splash .rain { display: block; }
      html[data-dev="1"] #splash .mote { display: none; }
      #splash .jelly-wrap {
        position: relative;
      }
      #splash .sash {
        display: none;
        position: absolute;
        top: 2px;
        right: -12px;
        width: 64px;
        height: 64px;
        overflow: hidden;
        animation: letter 0.4s ease-out 0.9s both;
      }
      html[data-dev="1"] #splash .sash { display: block; }
      #splash .sash span {
        position: absolute;
        top: 15px;
        right: -24px;
        width: 100px;
        rotate: 45deg;
        background: #62c6de;
        color: #0d0c11;
        font: 800 11px/17px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        letter-spacing: 0.16em;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }
      #splash .name .dev {
        color: #62c6de;
      }
      #splash .stage-fg {
        position: relative;
      }
      @keyframes jelly-rise {
        from { opacity: 0; transform: translateY(40px) scale(0.85); }
        to { opacity: 1; transform: none; }
      }
      @keyframes jelly-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes bell-pulse {
        0%, 100% { transform: scale(1, 1); }
        40% { transform: scale(1.06, 0.93); }
        70% { transform: scale(0.97, 1.04); }
      }
      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes sway {
        0%, 100% { transform: skewX(0deg); }
        50% { transform: skewX(6deg); }
      }
      @keyframes letter {
        to { opacity: 1; transform: none; }
      }
      @keyframes mote {
        0% { opacity: 0; transform: translate(0, 0); }
        15% { opacity: 0.9; }
        100% { opacity: 0; transform: translate(var(--dx), -105vh); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; transition: opacity 0.2s; }
        #splash .mote { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <canvas class="rain"></canvas>
      <div class="splash-stage stage-fg">
        <div class="jelly-wrap">
        <svg class="jelly" viewBox="0 0 120 120">
          <defs>
            <linearGradient id="sp-gold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffd98a" />
              <stop offset="0.55" stop-color="#e9b04b" />
              <stop offset="1" stop-color="#b9792a" />
            </linearGradient>
          </defs>
          <g class="bell">
            <path d="M18 62C18 34 37 20 60 20s42 14 42 42c-8-3-14 2-20-1-5-2-8 2-12 2H52c-4 0-7-4-12-2-6 3-12-2-22 1z" fill="url(#sp-gold)" />
            <g fill="none" stroke="#1a1720" stroke-width="3" opacity="0.75">
              <circle cx="49" cy="42" r="5" />
              <circle cx="71" cy="42" r="5" />
              <circle cx="54" cy="51" r="3.6" />
              <circle cx="66" cy="51" r="3.6" />
            </g>
          </g>
          <g fill="none" stroke="url(#sp-gold)" stroke-width="3.2" stroke-linecap="round">
            <path class="tentacle" d="M34 68c-3 10 4 17 0 30" />
            <path class="tentacle" d="M49 70c-3 12 4 19 0 34" />
            <path class="tentacle" d="M71 70c3 12-4 19 0 34" />
            <path class="tentacle" d="M86 68c3 10-4 17 0 30" />
          </g>
        </svg>
        <div class="sash"><span>DEV</span></div>
        </div>
        <div class="name"></div>
      </div>
    </div>
    <script>
      /** Columns of falling 0s and 1s, a shade lighter than the splash; still frame under reduced motion. */
      function rain(canvas) {
        const ctx = canvas.getContext("2d");
        const dpr = window.devicePixelRatio || 1;
        const size = 14;
        const light = matchMedia("(prefers-color-scheme: light)").matches;
        const ink = light ? "#b9b1a2" : "#3a3546";
        const head = light ? "#8f8676" : "#6b6380";
        let cols = [];
        let rows = 0;
        let bits = new Uint8Array(0);
        const fit = () => {
          canvas.width = innerWidth * dpr;
          canvas.height = innerHeight * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.font = `600 ${size - 2}px ui-monospace, "SF Mono", Menlo, monospace`;
          rows = Math.ceil(innerHeight / size) + 2;
          bits = Uint8Array.from({ length: Math.ceil(innerWidth / size) * rows }, () => Math.random() < 0.5);
          cols = Array.from({ length: Math.ceil(innerWidth / size) }, () => ({
            y: Math.random() * innerHeight,
            speed: 0.6 + Math.random() * 1.6,
            len: 8 + Math.floor(Math.random() * 22),
          }));
        };
        const draw = () => {
          ctx.clearRect(0, 0, innerWidth, innerHeight);
          cols.forEach((c, i) => {
            for (let k = 0; k < c.len; k++) {
              const y = c.y - k * size;
              if (y < -size || y > innerHeight + size) continue;
              ctx.globalAlpha = k === 0 ? 1 : 1 - k / c.len;
              ctx.fillStyle = k === 0 ? head : ink;
              ctx.fillText(bits[i * rows + Math.max(0, Math.floor(y / size))] ? "1" : "0", i * size, y);
            }
          });
          ctx.globalAlpha = 1;
        };
        fit();
        addEventListener("resize", fit);
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return draw();
        let last = 0;
        const tick = (t) => {
          if (!canvas.isConnected) return removeEventListener("resize", fit);
          if (t - last > 50) {
            last = t;
            for (let n = 0; n < bits.length / 40; n++) bits[(Math.random() * bits.length) | 0] ^= 1;
            cols.forEach((c) => {
              c.y += c.speed * size * 0.5;
              if (c.y - c.len * size > innerHeight) {
                c.y = -Math.random() * innerHeight * 0.3;
                c.speed = 0.6 + Math.random() * 1.6;
              }
            });
            draw();
          }
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
      (() => {
        const dev = document.documentElement.dataset.dev === "1";
        if (dev) document.title = "AureliaSpace Dev";
        const name = document.querySelector("#splash .name");
        (dev ? "AureliaSpace Dev" : "AureliaSpace").split("").forEach((ch, i) => {
          const s = document.createElement("span");
          s.textContent = ch === " " ? "\u00a0" : ch;
          s.style.setProperty("--i", i);
          if (i >= 13) s.className = "dev";
          else if (i >= 7) s.className = "gold";
          name.appendChild(s);
        });
        if (dev) rain(document.querySelector("#splash .rain"));
        const splash = document.getElementById("splash");
        for (let i = 0; i < 14; i++) {
          const m = document.createElement("div");
          m.className = "mote";
          m.style.left = `${8 + Math.random() * 84}%`;
          m.style.setProperty("--dx", `${(Math.random() - 0.5) * 80}px`);
          m.style.animationDuration = `${4 + Math.random() * 4}s`;
          m.style.animationDelay = `${Math.random() * 2.5}s`;
          splash.appendChild(m);
        }
        window.__splashStart = performance.now();
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
